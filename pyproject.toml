[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-autopsy"
version = "0.5.0"
description = "Analyze and debug AI agent traces with deterministic and LLM-assisted workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Haseeb Raza" }
]
dependencies = [
  "pydantic>=2.0,<3.0",
  "typer>=0.9,<1.0",
  "rich>=13.0,<14.0",
  "python-dotenv>=1.0,<2.0",
  "watchdog>=4.0,<5.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# Marker group: core CLI is already the base install; use for docs / CI matrices.
cli = []
llm = [
  "langgraph>=0.2,<1.0",
  "langchain>=0.3,<1.0",
  "langchain-core>=0.3,<1.0",
  "langchain-openai>=0.2,<1.0",
  "openai>=1.0,<3.0",
]
embeddings = [
  "sentence-transformers>=3.0,<4.0",
]
gui = [
  "streamlit>=1.29,<2.0",
]
mcp = [
  "mcp>=1.0,<2.0",
]
dev = [
  "pytest>=7.0,<9.0",
  "pytest-asyncio>=0.21,<1.0",
  "pillow>=10.0,<13.0",
  "ruff>=0.8,<1.0",
  "langgraph>=0.2,<1.0",
  "langchain>=0.3,<1.0",
  "langchain-core>=0.3,<1.0",
  "langchain-openai>=0.2,<1.0",
  "openai>=1.0,<3.0",
  "sentence-transformers>=3.0,<4.0",
  "streamlit>=1.29,<2.0",
  "mcp>=1.0,<2.0",
]
full = [
  "langgraph>=0.2,<1.0",
  "langchain>=0.3,<1.0",
  "langchain-core>=0.3,<1.0",
  "langchain-openai>=0.2,<1.0",
  "openai>=1.0,<3.0",
  "sentence-transformers>=3.0,<4.0",
  "streamlit>=1.29,<2.0",
  "mcp>=1.0,<2.0",
  "pytest>=7.0,<9.0",
  "pytest-asyncio>=0.21,<1.0",
  "pillow>=10.0,<13.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
autopsy = "agent_autopsy.cli:main"
autopsy-mcp = "agent_autopsy.mcp.server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.v1.*",
  # langchain's warn_deprecated(pending=True) creates a
  # LangChainPendingDeprecationWarning instance; CPython filters on the
  # instance's class even though a base category is passed to warnings.warn.
  "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
