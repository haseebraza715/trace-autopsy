name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full]"

      - name: Run tests
        run: pytest

      - name: Detector corpus eval
        run: python scripts/eval_detectors.py

      - name: Self-check (autopsy on example traces, dogfooding the CI gate)
        run: |
          for f in examples/traces/*.json; do
            # Don't fail the build — these fixtures intentionally contain
            # failure patterns. We're just smoke-testing the CLI exit codes.
            autopsy analyze "$f" --no-llm --no-embeddings -q -f json > /dev/null || true
          done
          # Real gate: regression check should pass on identical traces.
          autopsy diff examples/traces/successful_run.json \
                       examples/traces/successful_run.json \
                       --fail-on-regression -f json > /dev/null
