name: Agent Autopsy
description: |
  Run Agent Autopsy against trace files and gate the build on detected
  failure patterns. Wraps `autopsy analyze --fail-on` with optional PR
  commenting.

inputs:
  traces:
    description: |
      Glob (or single path) of trace JSON files to analyze. Each file
      is analyzed separately.
    required: true
  fail-on:
    description: |
      Comma-separated pattern names that should fail the run, e.g.
      "infinite_loop,token_waste,context_overflow". Empty (default)
      means "fail on any detected pattern" (the autopsy default).
    required: false
    default: ""
  python-version:
    description: Python version to install (3.10+).
    required: false
    default: "3.11"
  autopsy-ref:
    description: |
      Git ref of agent-autopsy to install (branch, tag, or SHA).
      Defaults to the latest tagged release on PyPI when blank.
    required: false
    default: ""
  comment-on-pr:
    description: Post a summary comment on the pull request (true/false).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install agent-autopsy
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -n "${{ inputs.autopsy-ref }}" ]; then
          pip install "git+https://github.com/haseebraza715/agent-autopsy.git@${{ inputs.autopsy-ref }}"
        else
          pip install agent-autopsy
        fi

    - name: Analyze traces
      id: analyze
      shell: bash
      run: |
        set +e
        mkdir -p .agent-autopsy
        FAIL=0
        SUMMARY=".agent-autopsy/summary.md"
        echo "## Agent Autopsy results" > "$SUMMARY"
        echo "" >> "$SUMMARY"
        echo "| Trace | Status | Findings |" >> "$SUMMARY"
        echo "|---|---|---|" >> "$SUMMARY"
        shopt -s nullglob
        for f in ${{ inputs.traces }}; do
          if [ -n "${{ inputs.fail-on }}" ]; then
            autopsy analyze "$f" --no-llm --no-embeddings -q -f json --fail-on "${{ inputs.fail-on }}" > ".agent-autopsy/$(basename $f).json"
          else
            autopsy analyze "$f" --no-llm --no-embeddings -q -f json > ".agent-autopsy/$(basename $f).json"
          fi
          rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 1 ]; then
            echo "| $f | error | parse/tool failure |" >> "$SUMMARY"
            FAIL=1
            continue
          fi
          if [ $rc -eq 1 ]; then
            FAIL=1
            STATUS="fail"
          else
            STATUS="pass"
          fi
          # Pull pattern names out of the json signals list
          PATS=$(python -c "import json,sys;d=json.load(open('.agent-autopsy/$(basename $f).json'));print(','.join(sorted({s['type'] for s in d.get('preanalysis',{}).get('signals',[])})) or 'none')")
          echo "| $f | $STATUS | $PATS |" >> "$SUMMARY"
        done
        echo "EXIT_CODE=$FAIL" >> "$GITHUB_OUTPUT"
        cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on PR
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('.agent-autopsy/summary.md', 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          await github.rest.issues.createComment({ owner, repo, issue_number, body });

    - name: Gate
      shell: bash
      run: |
        if [ "${{ steps.analyze.outputs.EXIT_CODE }}" = "1" ]; then
          echo "::error::Agent Autopsy gate failed — see summary above"
          exit 1
        fi
